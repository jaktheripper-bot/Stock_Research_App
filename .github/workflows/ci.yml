name: Pre-Flight CI & Contract Audit

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    # A free throwaway PostgreSQL for the contract tests (tests/contracts), which run the real app with
    # TESTING unset. It lives only for this job and holds no real data.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: moatnomics_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same isolated test environment as p0_release_gate.yml: local SQLite, test-only secrets.
      TESTING: "1"
      FORCE_LOCAL_SQLITE: "1"
      ADMIN_PASSWORD: ci_test_admin_pwd_default
      RAZORPAY_WEBHOOK_SECRET: ci_test_webhook_secret
      MOATNOMICS_TEST_POSTGRES_DSN: postgresql://postgres:ci_test_only@127.0.0.1:5432/moatnomics_contract_test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Same Python as production (Dockerfile: python:3.14-slim).
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run System Contract & Integrity Audit
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'MOCK_CI_KEY_FOR_STATIC_AUDIT' }}
      run: |
        python check_system.py

    - name: Run Python Regression Test Suite
      run: |
        python -m unittest discover -s tests

  # Any change to a protected file (ci/protected_paths.txt: contract tests, gate scripts, CI and deploy
  # config) needs a "Protected-Change-Approved:" trailer, whichever agent or person made it. The job
  # summary lists every protected change so the owner can review them.
  protected-files:
    name: Protected files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check changes to protected files
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        python3 scripts/check_protected_paths.py --range "${BASE_SHA}..${HEAD_SHA}"
