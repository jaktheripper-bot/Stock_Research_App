name: Autonomous Multi-Asset Scheduled Pipeline

# Manual runs only. Render cron jobs (render.yaml) time every scheduled run: close run 16:30 IST,
# backup 18:30, Market Close Wrap 19:30, fund run 23:15, backup 01:00, Fund NAV Update 07:30.
# GitHub's own scheduler was dropped because it started runs hours late or not at all.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode to execute"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - evening
          - close-backup
          - send-close-wrap
          - nightly
          - fund-backup
          - send-fund-update
          - all
      date:
        description: "Optional IST edition date (YYYY-MM-DD)"
        required: false
        type: string
      force:
        description: "Bypass distributed job lease lock / weekend market-closed guard"
        required: false
        default: false
        type: boolean

concurrency:
  group: moatnomics-pipeline-${{ inputs.mode || 'default' }}
  cancel-in-progress: false

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Cloud Multi-Asset Pipeline
        env:
          TZ: Asia/Kolkata
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SMARTAPI_PROXY_URL: ${{ secrets.SMARTAPI_PROXY_URL }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENABLE_LIVE_EMAIL_DISPATCH: "1"
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          BETTER_STACK_SOURCE_TOKEN: ${{ secrets.BETTER_STACK_SOURCE_TOKEN }}
          BETTER_STACK_INGESTING_HOST: ${{ secrets.BETTER_STACK_INGESTING_HOST }}
          BETTER_STACK_HEARTBEAT_URL: ${{ secrets.BETTER_STACK_HEARTBEAT_URL }}
          # Inputs reach the shell only as env vars, never pasted into the script text.
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          case "$INPUT_MODE" in
            auto|evening|close-backup|send-close-wrap|nightly|fund-backup|send-fund-update|all) ;;
            *) echo "Invalid mode" >&2; exit 2 ;;
          esac
          ARGS=(--mode "$INPUT_MODE")
          if [ -n "$INPUT_DATE" ]; then
            if [[ ! "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date: use YYYY-MM-DD" >&2; exit 2
            fi
            ARGS+=(--date "$INPUT_DATE")
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          python scripts/run_scheduled_pipeline.py "${ARGS[@]}"
