[pytest]
markers =
    integration: Live third-party provider integration tests over network sockets (deselect with '-m "not integration"')
addopts = -m "not integration"
testpaths =
    test_checker.py
    test_ui_headless.py
    tests
python_files = test_*.py
norecursedirs = scratch backups .git .antigravity
asyncio_mode = strict
