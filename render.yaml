# Render Blueprint for Moatnomics scheduled jobs and background workers.
#
# What this file manages: the seven cron jobs and one background worker below. They build from the
# same Dockerfile and branch as the website. Render is the only scheduler: GitHub Actions keeps its
# workflows for manual runs but no longer times any run.
#
# What it deliberately does NOT manage:
#   - The website ("Moatnomics.com", Docker web service, Singapore). It was created in the Render
#     dashboard; a new Blueprint would create a second, suffixed copy rather than adopt it, so it
#     stays dashboard-managed. Its env vars live on that service.
#
# Secrets: every service reads them from the dashboard-managed environment group
# `moatnomics-pipeline-secrets` (`fromGroup`), so a key is changed in one place. The only per-job
# secrets are each sender's own Better Stack heartbeat URL (`sync: false`). A value set directly on
# a service overrides the group, so per-service copies of group keys must be deleted in the dashboard.
# Schedules are UTC (IST = UTC + 5:30).
#
# Deploy gate: `autoDeployTrigger: checksPass` makes every service below rebuild only after the GitHub
# checks on that commit pass, so a failing test can't reach a cron that emails subscribers. The website
# needs the same setting made by hand in the dashboard (Settings -> Build & Deploy -> Auto-Deploy ->
# "After CI Checks Pass").

services:
  # 16:30 IST: main close run (asset refresh, discovery reel, MSME, stock reports, monthly SEBI MF sync). No email.
  - type: cron
    name: close-run
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: standard
    dockerfilePath: ./Dockerfile
    schedule: "0 11 * * *"
    dockerCommand: "python3 scripts/run_scheduled_pipeline.py --mode evening"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      # Stops a hung run after 90 minutes instead of Render's 12-hour cut-off (billing is per second of run time).
      - key: PIPELINE_MAX_RUNTIME_SECONDS
        value: "5400"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "0"

  # 18:30 IST: re-runs any unfinished 16:30 IST close-run phase (finished/in-progress phases are skipped).
  - type: cron
    name: close-run-backup
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: standard
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * *"
    dockerCommand: "python3 scripts/run_scheduled_pipeline.py --mode close-backup"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      # Stops a hung run after 90 minutes instead of Render's 12-hour cut-off (billing is per second of run time).
      - key: PIPELINE_MAX_RUNTIME_SECONDS
        value: "5400"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "0"

  # 19:30 IST daily: sends the Market Close Wrap once its phases are done (waits up to 60 min; fails
  # closed on empty sections). Weekends and NSE holidays exit early but still ping the heartbeat.
  - type: cron
    name: market-close-wrap-sender
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: starter
    dockerfilePath: ./Dockerfile
    schedule: "0 14 * * *"
    dockerCommand: "python3 scripts/run_scheduled_pipeline.py --mode send-close-wrap"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      # Stops a hung run after 75 minutes instead of Render's 12-hour cut-off (billing is per second of run time).
      - key: PIPELINE_MAX_RUNTIME_SECONDS
        value: "4500"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: BETTER_STACK_HEARTBEAT_URL_MARKET_CLOSE
        sync: false
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "1"
      - key: SMTP_FROM
        value: "Moatnomics Service Desk <desk@moatnomics.com>"

  # 23:15 IST: main fund run (AMFI NAVs, post-NAV ETF matrix, fund rotation audit). No email.
  - type: cron
    name: fund-run
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: standard
    dockerfilePath: ./Dockerfile
    schedule: "45 17 * * *"
    dockerCommand: "python3 scripts/run_scheduled_pipeline.py --mode nightly"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      # Stops a hung run after 90 minutes instead of Render's 12-hour cut-off (billing is per second of run time).
      - key: PIPELINE_MAX_RUNTIME_SECONDS
        value: "5400"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "0"

  # 01:00 IST: re-runs any unfinished 23:15 IST fund-run phase for the previous date.
  - type: cron
    name: fund-run-backup
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: standard
    dockerfilePath: ./Dockerfile
    schedule: "30 19 * * *"
    dockerCommand: "python3 scripts/run_scheduled_pipeline.py --mode fund-backup"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      # Stops a hung run after 90 minutes instead of Render's 12-hour cut-off (billing is per second of run time).
      - key: PIPELINE_MAX_RUNTIME_SECONDS
        value: "5400"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "0"

  # 07:30 IST daily: sends the Fund NAV Update for the prior trading day (waits up to 45 min; fails
  # closed on empty sections). Days after a weekend/NSE holiday exit early but still ping the heartbeat.
  - type: cron
    name: fund-nav-update-sender
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: starter
    dockerfilePath: ./Dockerfile
    schedule: "0 2 * * *"
    dockerCommand: "python3 scripts/run_scheduled_pipeline.py --mode send-fund-update"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      # Stops a hung run after 60 minutes instead of Render's 12-hour cut-off (billing is per second of run time).
      - key: PIPELINE_MAX_RUNTIME_SECONDS
        value: "3600"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: BETTER_STACK_HEARTBEAT_URL_FUND_NAV
        sync: false
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "1"
      - key: SMTP_FROM
        value: "Moatnomics Service Desk <desk@moatnomics.com>"

  # 21:00 IST daily: owner-only subscription renewal & cost reminder (at most one email per IST date).
  - type: cron
    name: subscription-renewal-reminder
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: starter
    dockerfilePath: ./Dockerfile
    schedule: "30 15 * * *"
    dockerCommand: "python3 scripts/send_subscription_reminder.py --send-email"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "1"
      - key: SMTP_FROM
        value: "Moatnomics Service Desk <desk@moatnomics.com>"

  # Always on: claims and runs paid mutual fund deep-dive audits. The website refuses new paid audits
  # (no credits charged) whenever this worker's heartbeat is older than 30 seconds.
  - type: worker
    name: paid-fund-audit-worker
    runtime: docker
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: "python3 scripts/run_paid_fund_audit_worker.py"
    envVars:
      - fromGroup: moatnomics-pipeline-secrets
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "0"
      - key: BETTER_STACK_INGESTING_HOST
        value: "s2808842.us-west-2a.betterstackdata.com"
      - key: CANONICAL_DOMAIN
        value: https://moatnomics.com
      - key: ENABLE_LIVE_EMAIL_DISPATCH
        value: "0"
