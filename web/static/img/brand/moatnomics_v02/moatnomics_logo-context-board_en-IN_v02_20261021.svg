    <text x="0" y="152" fill="#282F33" font-family="Inter, Arial, sans-serif" font-size="31">1. Use the dimensional mark for considered editorial moments, not dense interfaces.</text>
    <text x="0" y="210" fill="#282F33" font-family="Inter, Arial, sans-serif" font-size="31">2. Use the flat master for UI, favicons, monochrome and small-scale reproduction.</text>
    <text x="0" y="268" fill="#282F33" font-family="Inter, Arial, sans-serif" font-size="31">3. Preserve one central mirror width of clear space; never add glow, chrome or unapproved shadows.</text>
    <text x="0" y="356" fill="#0B2337" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">NARRATIVE LOGIC</text>
    <text x="0" y="414" fill="#282F33" font-family="Inter, Arial, sans-serif" font-size="30">The split arches form the discovery tunnel. The mirror cuts through it, reframing the same evidence from another vantage.</text>
